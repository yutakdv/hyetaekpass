plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}
group = 'kr.hyetaekpass'
version = '0.1.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
repositories { mavenCentral() }
dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'com.networknt:json-schema-validator:1.5.8'
    implementation platform('software.amazon.awssdk:bom:2.55.8')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:url-connection-client'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') { useJUnitPlatform(); if (project.hasProperty('skipDatabaseTests')) exclude '**/ProductionHttpTest*' }
tasks.named('processResources') {
    from('../contracts/catalog.schema.json')
    from('../contracts/empty-catalog.json')
}
